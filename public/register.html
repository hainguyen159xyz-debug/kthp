<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - SportZone</title>
  <meta name="description" content="Đăng ký tài khoản thành viên SportZone để nhận ngay mã ưu đãi giảm giá 10% cho đơn hàng đầu tiên.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/client.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Header Minimal -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-badge">SZ</span> Sport<span>Zone</span>
      </a>
      <a href="/" class="btn btn-secondary btn-sm">Quay về trang chủ</a>
    </div>
  </header>

  <!-- Main Register Form -->
  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh; padding: 40px 20px;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 36px 30px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="badge badge-primary" style="margin-bottom: 12px;">THÀNH VIÊN MỚI</div>
        <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 6px;">Tạo Tài Khoản Mới</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Trở thành thành viên SportZone để nhận nhiều ưu đãi độc quyền</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Họ và tên *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Địa chỉ Email *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Số điện thoại</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="09xxxxxxxx">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Mật khẩu *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Xác nhận mật khẩu *</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-register-submit" style="margin-top: 10px;">
          Đăng ký tài khoản
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Đã có tài khoản?
        <a href="/login.html" style="color: var(--color-primary); font-weight: 700; margin-left: 4px;">Đăng nhập ngay</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-bottom">
      <div>© 2026 SportZone Inc. Tất cả quyền được bảo lưu.</div>
      <div>Bảo mật xác thực chuẩn REST API</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const btnSubmit = document.getElementById('btn-register-submit');

      form.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Đang đăng ký...';

        const success = await window.auth.register({
          name,
          email,
          phone,
          password,
          confirmPassword
        });

        if (!success) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Đăng ký tài khoản';
        }
      };
    });
  </script>
</body>
</html>
